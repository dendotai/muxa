name: Release

# RELEASING.md has the flow. npmjs.com trusts this file by its name for publishing, so a rename breaks the publish.
on:
  push:
    branches: [main]

# A cancel between the tag push and the GitHub release leaves a tag with no release notes, so runs queue.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The ruleset on main requires no status check, so a red release PR can merge; the publish waits for CI on the merged commit.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # semantic-release pushes the tag and writes the GitHub release
      id-token: write # npm trusted publishing: npmjs.com trusts this workflow file, so no token exists
      pull-requests: write # `Rename the merged release PR` edits the PR title

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # semantic-release reads every tag and commit since the last release

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # @semantic-release/npm calls `npm publish`, and only npm 11.5.1 or later publishes through OIDC; Node 24 ships it.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.3
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      # The files `bin` names must exist when npm first reads the manifest; `prepack` builds them again after semantic-release writes the version, and that build ships.
      - run: bun run build
        working-directory: packages/muxa

      # npm shows the package's own README, and the full one lives at the repo root.
      - run: cp README.md packages/muxa/README.md

      - name: Release
        run: npx semantic-release@25.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A release PR opens as "Release TBD", because the version does not exist until the Release step computes it. This step writes the real title ("Release v1.4.2") onto the PR whose merge started the run. Cosmetic: npm already has the release, so a failure here must not fail the run.
      - name: Rename the merged release PR
        continue-on-error: true
        run: |
          tag=$(git tag --points-at "$GITHUB_SHA" | grep '^v' | head -1 || true)
          if [ -z "$tag" ]; then
            echo "no release tag on $GITHUB_SHA: nothing was released"
            exit 0
          fi
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number' || true)
          if [ -z "$pr" ] || [ "$pr" = null ]; then
            echo "no PR behind $GITHUB_SHA (a direct push)"
            exit 0
          fi
          gh pr edit "$pr" --title "Release $tag"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
